[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courses-variant03"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.118,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
regression = ["pytest>=8,<9", "testcontainers[postgres]>=4.8,<5", "pytest-randomly>=3.15", "pytest-repeat>=0.9"]

[tool.setuptools.packages.find]
include = ["courses*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "smoke: critical scenarios; subset of the regression suite",
    "regression: full regression suite (includes smoke)",
]
